name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/palette_e2e
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/palette_test
      E2E_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/palette_e2e
      SESSION_SECRET: ci-secret-ci-secret-ci-secret-ci-secret
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: psql postgresql://postgres:postgres@localhost:5432/postgres -f scripts/init-test-dbs.sql
      - run: npx playwright install --with-deps chromium
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run build
      - run: npm run test:all
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rapport-tests
          path: reports/
