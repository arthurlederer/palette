# Environnement de test GitHub Codespaces : l'app (Node 22) et sa base PostgreSQL 16.
# L'app partage le réseau de la base : PostgreSQL répond sur localhost:5432.
services:
  app:
    image: mcr.microsoft.com/devcontainers/javascript-node:1-22-bookworm
    volumes:
      - ../..:/workspaces:cached
    command: sleep infinity
    network_mode: service:db

  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: palette
    volumes:
      - postgres-data:/var/lib/postgresql/data
      # Bases des tests automatisés (npm run test:all), créées au premier démarrage.
      - ../scripts/init-test-dbs.sql:/docker-entrypoint-initdb.d/init-test-dbs.sql:ro

volumes:
  postgres-data:
